services:
  app:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-}
    environment:
      NEO4J_ENABLED: ${NEO4J_ENABLED:-false}
      NEO4J_URI: ${NEO4J_URI:-}
      NEO4J_USER: ${NEO4J_USER:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sample_data:/app/app/data
      - generated_assets:/app/assets

volumes:
  sample_data:
  generated_assets:
